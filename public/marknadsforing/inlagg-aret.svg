<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img"
     aria-label="Du fakturerade 525 000 kr. 222 147 kr fick du behålla.">
  <!-- Instagram och Facebook, kvadrat 1080x1080.
       Siffrorna är räknade med appens egen skattemotor och är samma
       exempel som landningssidan visar — bild och sajt ska aldrig
       säga olika saker. -->
  <defs>
    <style>
      .rubrik { font-family:'Familjen Grotesk','Segoe UI',system-ui,sans-serif; font-weight:700; letter-spacing:-2.5px; }
      .tal    { font-family:'IBM Plex Mono','Cascadia Mono',Consolas,monospace; font-weight:600; }
      /* Spärren hålls nere: staplarnas kolumner är smala, och vid
         2,6 px gick etiketterna in i varandra. */
      .etikett{ font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; font-weight:600;
                letter-spacing:1.5px; }
      .brod   { font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; font-weight:400; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="#E4EBE7"/>

  <!-- Märket -->
  <g transform="translate(80,72)">
    <rect width="44" height="44" rx="10" fill="#131E26"/>
    <rect x="10" y="8"  width="24" height="6"  fill="#3E5566"/>
    <rect x="10" y="15" width="24" height="4"  fill="#63798A"/>
    <rect x="10" y="20" width="24" height="4"  fill="#8A9CA8"/>
    <rect x="10" y="25" width="24" height="11" fill="#B8862B"/>
    <text x="60" y="32" class="rubrik" font-size="27" letter-spacing="-0.8" fill="#131E26">Kvario</text>
  </g>

  <!-- Påståendet -->
  <text x="80" y="290" class="rubrik" font-size="76" fill="#131E26">Du fakturerade</text>
  <text x="80" y="374" class="rubrik" font-size="76" fill="#131E26">525 000 kr i fjol.</text>

  <!-- "blev dina" var for vardagligt, och upprepade dessutom
       etiketten KVAR TILL DIG som star direkt under stapeln. -->
  <text x="80" y="486" class="rubrik" font-size="76" fill="#8C6418">222 147 kr fick du behålla.</text>

  <!-- Stapeln: samma uppdelning som appen visar -->
  <g transform="translate(0,606)">
    <rect x="80"  y="0" width="180" height="104" fill="#3E5566"/>
    <rect x="266" y="0" width="117" height="104" fill="#63798A"/>
    <rect x="389" y="0" width="223" height="104" fill="#8A9CA8"/>
    <rect x="618" y="0" width="382" height="104" fill="#B8862B"/>
  </g>

  <g transform="translate(0,752)">
    <text x="80"  y="0"  class="etikett" font-size="16" fill="#4A5D68">MOMS</text>
    <text x="80"  y="36" class="tal"     font-size="30" fill="#131E26">105 000</text>

    <text x="266" y="0"  class="etikett" font-size="16" fill="#4A5D68">KOSTNADER</text>
    <text x="266" y="36" class="tal"     font-size="30" fill="#131E26">68 000</text>

    <text x="389" y="0"  class="etikett" font-size="16" fill="#4A5D68">SKATT &amp; AVGIFTER</text>
    <text x="389" y="36" class="tal"     font-size="30" fill="#131E26">129 853</text>

    <text x="618" y="0"  class="etikett" font-size="16" fill="#8C6418">KVAR TILL DIG</text>
    <text x="618" y="40" class="tal"     font-size="38" fill="#8C6418">222 147</text>
  </g>

  <!-- Avslut -->
  <line x1="80" y1="872" x2="1000" y2="872" stroke="#C6D3CD" stroke-width="2"/>
  <text x="80" y="932" class="brod" font-size="29" fill="#4A5D68">Momsen var aldrig dina. Kvario uppskattar vad som</text>
  <text x="80" y="972" class="brod" font-size="29" fill="#4A5D68">blir kvar — medan året fortfarande pågår.</text>

  <text x="80" y="1030" class="etikett" font-size="20" fill="#131E26">14 DAGAR GRATIS · INGET KORT</text>
  <text x="1000" y="1030" class="brod" font-size="17" fill="#8698A1" text-anchor="end">Exempel · enskild firma</text>
</svg>
