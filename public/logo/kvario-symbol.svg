<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kvario">
  <!-- Kvarios märke: pengarna som kommer in, uppdelade i band.
       De grå är moms, kostnader, skatt och avgifter. Det nedersta
       i mässing är det som faktiskt blir kvar till dig — samma bild
       som stapeln visar i appen. -->
  <rect width="64" height="64" rx="14" fill="#131E26"/>
  <rect x="14" y="12" width="36" height="8"  fill="#3E5566"/>
  <rect x="14" y="22" width="36" height="6"  fill="#63798A"/>
  <rect x="14" y="30" width="36" height="5"  fill="#8A9CA8"/>
  <rect x="14" y="37" width="36" height="15" fill="#B8862B"/>
</svg>
