<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Kvario">
  <!-- För mörka bakgrunder. Märket byter till ljus platta så att
       banden syns, och ordbilden blir ljus. Mässingen är densamma
       i båda versionerna — det är den som bär igenkänningen. -->
  <rect width="64" height="64" rx="14" fill="#FAFCFB"/>
  <rect x="14" y="12" width="36" height="8"  fill="#8A9CA8"/>
  <rect x="14" y="22" width="36" height="6"  fill="#63798A"/>
  <rect x="14" y="30" width="36" height="5"  fill="#3E5566"/>
  <rect x="14" y="37" width="36" height="15" fill="#B8862B"/>

  <text x="82" y="43"
        font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.8"
        fill="#FAFCFB">Kvario</text>
</svg>
