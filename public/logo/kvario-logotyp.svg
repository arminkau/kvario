<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" role="img" aria-label="Kvario">
  <!-- Liggande logotyp: märket plus ordbild.
       Ordbilden sätts i Familjen Grotesk, samma typsnitt som
       appens rubriker. Saknas det på datorn faller den tillbaka
       på ett geometriskt alternativ. -->
  <rect width="64" height="64" rx="14" fill="#131E26"/>
  <rect x="14" y="12" width="36" height="8"  fill="#3E5566"/>
  <rect x="14" y="22" width="36" height="6"  fill="#63798A"/>
  <rect x="14" y="30" width="36" height="5"  fill="#8A9CA8"/>
  <rect x="14" y="37" width="36" height="15" fill="#B8862B"/>

  <text x="82" y="43"
        font-family="'Familjen Grotesk', 'Helvetica Neue', Arial, sans-serif"
        font-size="34" font-weight="700" letter-spacing="-0.8"
        fill="#131E26">Kvario</text>
</svg>
