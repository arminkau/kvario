<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area i CSS gör att appen inte hamnar
         under mobilens hak eller hemknappsstreck -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kvario — vad av pengarna som faktiskt är dina</title>
    <meta name="description" content="Se direkt hur mycket av det du fakturerar som är moms, skatt och egenavgifter — och vad som faktiskt blir kvar till dig." />
    <meta name="theme-color" content="#E4EBE7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kvario" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body style="margin:0">
    <div id="root"></div>
    <!-- Studsen tillbaka till mobilappen efter ett köp.

         Stripe godtar bara http och https i success_url, så djuplänken
         kan inte anges där. I stället skickar Stripe hit, och den här
         raden lämnar vidare till appen.

         Den står före modulen med flit: laddades hela appen först skulle
         den hinna rendera i webbläsarfliken, och kunden se en skymt av en
         inloggningssida innan appen tog över. Skriptet är avsiktligt
         gammaldags och beroendefritt så att det kör direkt.

         replace och inte href: den här adressen ska inte ligga kvar i
         historiken, för då leder bakåtknappen till en tom studssida. -->
    <script>
      (function () {
        try {
          var f = new URLSearchParams(window.location.search);
          if (f.get("retur") !== "app") return;
          var avbruten = f.get("avbruten") === "1" ? "?avbruten=1" : "";
          window.location.replace("se.kvario.app://betalt" + avbruten);
        } catch (e) { /* gammal webbläsare — appen laddas som vanligt */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
