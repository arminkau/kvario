# ============================================================
# Bygger en osignerad IPA att prova på egen iPhone
#
# Filen som faller ut går INTE att installera rakt av. En iPhone
# kör bara signerad kod, och signeringen sker i stället hos dig:
# Sideloadly eller AltStore på Windows signerar om filen med ditt
# vanliga Apple-ID och lägger över den på telefonen.
#
# Det kostar ingenting, men Apple låter en gratis inloggning
# signera i sju dagar. Efter det slutar appen starta och måste
# läggas över igen. Se README.
#
# Att bygga här och signera hos dig är också det enda sättet när
# utvecklingen sker på Windows, där Xcode inte finns.
# ============================================================

name: Bygg iOS

on:
  push:
    branches: [main]
    # Bara när något som rör iOS ändrats. macOS-minuter kostar tio
    # gånger så mycket som Linux i GitHubs kvot.
    paths:
      - "ios/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/ios-bygge.yml"
  workflow_dispatch:

jobs:
  bygg:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22          # Capacitors CLI kräver minst 22
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Bygg webbdelen
        run: npm run build

      # Skriver om Package.swift med sökvägar som gäller här. Filen i
      # git har snedstrecken åt unix-håll med flit, men det är den här
      # som gäller vid bygget.
      - name: Synka Capacitor
        run: npx cap sync ios

      - name: Kontrollera att appikonen duger åt Apple
        run: |
          IKON="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          # Färgtypen ligger i byte 25 av en PNG. 2 = RGB, 6 = RGBA.
          # Apple avvisar ikoner som har en alfakanal, så det ska vara 2.
          TYP=$(xxd -p -s 25 -l 1 "$IKON")
          if [ "$TYP" != "02" ]; then
            echo "Appikonen har färgtyp 0x$TYP, väntade 02 (RGB utan alfa)."
            echo "Kör: node verktyg/gor-ios-ikon.mjs"
            exit 1
          fi
          echo "Appikonen är RGB utan alfakanal."

      # -project, inte -workspace. Capacitor 8 använder Swift Package
      # Manager i stället för CocoaPods, så någon .xcworkspace finns
      # inte — beroendena ligger i CapApp-SPM bredvid projektet.
      - name: Bygg appen utan signering
        working-directory: ios/App
        run: |
          xcodebuild \
            -scheme App \
            -project App.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath bygge \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      # En IPA är en zip med appen i en mapp som heter Payload. Mer än
      # så är det inte, och det är därför den går att signera om i
      # efterhand utan att byggas på nytt.
      - name: Paketera till IPA
        working-directory: ios/App
        run: |
          APP="bygge/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP" ]; then
            echo "Hittar ingen App.app på $APP"
            ls -R bygge/Build/Products || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr Kvario-osignerad.ipa Payload
          echo "IPA klar: $(du -h Kvario-osignerad.ipa | cut -f1)"

      # Kontrollerar att paketet innehåller det som behövs, i stället
      # för att upptäcka det först när telefonen vägrar.
      - name: Kontrollera paketet
        working-directory: ios/App
        run: |
          unzip -l Kvario-osignerad.ipa | grep -q "Payload/App.app/Info.plist" \
            || { echo "Ingen Info.plist i paketet."; exit 1; }
          SCHEMA=$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" \
            "Payload/App.app/Info.plist" 2>/dev/null || echo "SAKNAS")
          if [ "$SCHEMA" != "se.kvario.app" ]; then
            echo "URL-schemat för Google-inloggningen saknas i bygget: $SCHEMA"
            exit 1
          fi
          echo "Paketet innehåller URL-schemat $SCHEMA."

      - uses: actions/upload-artifact@v4
        with:
          name: kvario-ipa
          path: ios/App/Kvario-osignerad.ipa
          if-no-files-found: error
