name: Provperiodskoll (manuell)

# Schemat är borttaget med flit. Servern kör numera det här jobbet
# själv var sjätte timme — se kommentaren längst ned i server/server.js.
#
# Skälet: i ett publikt repo stänger GitHub av schemalagda workflows
# efter 60 dagar utan aktivitet i repot. Ett schema här hade alltså
# tystnat efter två lugna månader, och gjort det utan att synas.
# workflow_dispatch omfattas inte av den regeln.
#
# Kvar som knapp för att kunna köra jobbet på begäran utan att leta
# fram token och skriva curl för hand.

on:
  workflow_dispatch:

jobs:
  provperiod:
    runs-on: ubuntu-latest
    steps:
      - name: Kör provperiodskollen nu
        run: |
          kod=$(curl -sS --max-time 60 -o svar.json -w "%{http_code}" \
            -X POST https://kvario-server.fly.dev/jobb/provperiod \
            -H "x-admin-token: ${{ secrets.ADMIN_TOKEN }}" \
            -H "content-type: application/json" \
            -d '{}')
          echo "Svar $kod:"
          cat svar.json; echo
          if [ "$kod" != "200" ]; then
            echo "::error::Jobbet svarade $kod i stället för 200"
            exit 1
          fi
