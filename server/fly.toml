# fly.toml app configuration file generated for kvario-server on 2026-08-17T22:29:29+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kvario-server'
primary_region = 'arn'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true

  # Maskinen får inte stängas av. Stripes webhook kommer när den
  # kommer, och en kalluppstart mitt i ett köp riskerar att Pro inte
  # aktiveras förrän Stripe gjort om anropet.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    # Inte /halsa — den öppnar en riktig SMTP-anslutning, och skulle
    # både hamra Strato och göra hälsokontrollen beroende av posten.
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
